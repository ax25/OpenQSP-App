name: Generate platform icons

on:
  push:
    branches:
      - feature/openqsp-app-icon-final
    paths:
      - .github/workflows/generate-platform-icons.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openqsp-app-icon-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate platform icon assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import base64
          import io

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          encoded = ''.join(Path('.github/icon-source.b64').read_text().split())
          encoded += '=' * (-len(encoded) % 4)
          source = Image.open(io.BytesIO(base64.b64decode(encoded))).convert('RGB')
          master = source.resize((1024, 1024), Image.Resampling.LANCZOS)

          android_icons = {
              'android/app/src/main/res/mipmap-mdpi/ic_launcher.png': 48,
              'android/app/src/main/res/mipmap-hdpi/ic_launcher.png': 72,
              'android/app/src/main/res/mipmap-xhdpi/ic_launcher.png': 96,
              'android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png': 144,
              'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png': 192,
          }
          for filename, size in android_icons.items():
              master.resize((size, size), Image.Resampling.LANCZOS).save(filename, format='PNG', optimize=True)

          ios_dir = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          ios_icons = {
              'Icon-App-20x20@1x.png': 20,
              'Icon-App-20x20@2x.png': 40,
              'Icon-App-20x20@3x.png': 60,
              'Icon-App-29x29@1x.png': 29,
              'Icon-App-29x29@2x.png': 58,
              'Icon-App-29x29@3x.png': 87,
              'Icon-App-40x40@1x.png': 40,
              'Icon-App-40x40@2x.png': 80,
              'Icon-App-40x40@3x.png': 120,
              'Icon-App-60x60@2x.png': 120,
              'Icon-App-60x60@3x.png': 180,
              'Icon-App-76x76@1x.png': 76,
              'Icon-App-76x76@2x.png': 152,
              'Icon-App-83.5x83.5@2x.png': 167,
              'Icon-App-1024x1024@1x.png': 1024,
          }
          for filename, size in ios_icons.items():
              image = master if size == 1024 else master.resize((size, size), Image.Resampling.LANCZOS)
              image.save(ios_dir / filename, format='PNG', optimize=True)

          mac_dir = Path('macos/Runner/Assets.xcassets/AppIcon.appiconset')
          for size in (16, 32, 64, 128, 256, 512, 1024):
              image = master if size == 1024 else master.resize((size, size), Image.Resampling.LANCZOS)
              image.save(mac_dir / f'app_icon_{size}.png', format='PNG', optimize=True)

          master.save(
              Path('windows/runner/resources/app_icon.ico'),
              format='ICO',
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          PY

      - name: Commit generated assets and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-platform-icons.yml .github/icon-source.b64
          git add android/app/src/main/res/mipmap-*/ic_launcher.png \
                  ios/Runner/Assets.xcassets/AppIcon.appiconset \
                  macos/Runner/Assets.xcassets/AppIcon.appiconset \
                  windows/runner/resources/app_icon.ico
          git commit -m "Add OpenQSP platform app icons"
          git push origin HEAD:feature/openqsp-app-icon-final
